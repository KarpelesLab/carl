[package]
name = "carl"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Carl — a multipurpose MCP helper that gives AI agents hands: wallets, email, and more, over stdio."
repository = "https://github.com/KarpelesLab/carl"
readme = "README.md"
keywords = ["mcp", "ai", "agent", "wallet", "email"]
categories = ["command-line-utilities"]

[dependencies]
rmcp = { version = "1.8", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io-util"] }
rustix = { version = "1", features = ["net", "process"] }
rsupd = { version = "0.3.5", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rsurl = { version = "0.1.15", default-features = false, features = ["purecrypto-tls"] }
purecrypto = { version = "0.9.6", default-features = false, features = ["std", "hash", "rng", "jose"] }

[features]
# Self-update the daemon from signed releases. Enabled only for official (CI)
# builds, so a local build is never replaced behind a developer's back.
auto-update = ["dep:rsupd"]

[profile.release]
strip = true
lto = "thin"
